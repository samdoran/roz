[project]
name = "roz"
version = "0.1.0"
description = "Helpful assistant to help deliver goose (and friends) in pagure and gitlab."
readme = "README.md"
authors = [
    { name = "Rodolfo Olivieri", email = "rolivier@redhat.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bodhi-client>=26.4.0",
    "keyring>=25.0.0",
    "ogr>=0.62.4",
]

[project.scripts]
roz = "roz:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "radon>=6.0.1",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "RUF100", # unused noqa directives
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "TID252", # ban relative imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
case-sensitive = false
force-single-line = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[tool.ty.environment]
python-version = "3.12"
